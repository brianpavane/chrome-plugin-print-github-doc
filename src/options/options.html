<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Print GitHub Doc Options</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 16px;
        min-width: 320px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .hint {
        color: GrayText;
        font-size: 12px;
      }
      #status {
        height: 1.5em;
        color: GrayText;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="printLinkUrls" />
      <span>
        Print link URLs after link text
        <div class="hint">e.g. "docs (https://github.com/…)". Useful on paper; adds clutter in PDFs.</div>
      </span>
    </label>
    <p class="hint">Shortcut: Alt+Shift+P (change at chrome://extensions/shortcuts).</p>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
